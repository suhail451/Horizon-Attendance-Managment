<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMIU | Attendance System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <h2>True North</h2>
       <nav>
           <a href="attendance.html" class="active">Mark Attendance</a>
            <a href="student.html">Student Management</a>
            <a href="index.html" style="margin-top: 50px; color: #e74c3c; border-top: 1px solid #444;">← Logout / Home</a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <h1>Daily Attendance</h1>
            <p id="current-date"></p>
        </header>

        <section class="attendance-card">
            <div class="controls">
                <input type="number" id="studentIdInput" placeholder="Enter Student ID">
                <select id="statusInput">
                    <option value="PRESENT">Present</option>
                    <option value="ABSENT">Absent</option>
                    <option value="LATE">Late</option>
                </select>
                <button onclick="submitAttendance()" class="btn-primary">Mark Now</button>
            </div>
            
            <div id="response-message" class="message"></div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
