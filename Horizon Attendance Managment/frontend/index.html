<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMIU | Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .home-bg {
            height: 100vh;
            width: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                url('horizon.png');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card h1 { font-size: 3rem; margin-bottom: 10px; letter-spacing: 2px; }
        .glass-card p { margin-bottom: 30px; font-weight: 300; opacity: 0.8; }

        .btn-container { display: flex; gap: 20px; justify-content: center; }

        .nav-btn {
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-attendance { background: #1abc9c; color: white; }
        .btn-students { background: #3498db; color: white; }
        .nav-btn:hover { transform: translateY(-5px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="home-bg">
        <div class="glass-card">
            <h1>Horizon University Karachi </h1>
            <p>Think Create Innovate | Attendance Portal</p>
            <div class="btn-container">
                <a href="attendance.html" class="nav-btn btn-attendance">Mark Attendance</a>
                <a href="student.html" class="nav-btn btn-students">Student Management</a>
            </div>
        </div>
    </div>
</body>
</html>
